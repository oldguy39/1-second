name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack and build
        run: |
          unzip -q *.zip
          cd "one sec"
          bash ./gradlew assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "one sec/app/build/outputs/apk/debug/app-debug.apk" OneSecondOff.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest OneSecondOff.apk \
            --target "${{ github.sha }}" \
            --title "One Second Off (latest build)" \
            --notes "Debug build from commit ${{ github.sha }}"
